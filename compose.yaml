services:
  api:
    build: .
    image: document-insight-service:local
    env_file: .env
    ports:
      - "8000:8000"

  ui:
    image: document-insight-service:local
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
